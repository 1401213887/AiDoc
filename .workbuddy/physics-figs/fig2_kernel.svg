<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" width="1080" height="560"><rect x="0" y="0" width="1080" height="560" fill="#ffffff"/><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7.4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#7a828a"/></marker><marker id="ab" markerWidth="9" markerHeight="9" refX="7.4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2f6feb"/></marker><marker id="ac" markerWidth="9" markerHeight="9" refX="7.4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#8e44ad"/></marker><marker id="ao" markerWidth="9" markerHeight="9" refX="7.4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1f9254"/></marker><marker id="aw" markerWidth="9" markerHeight="9" refX="7.4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#c0392b"/></marker><marker id="am" markerWidth="9" markerHeight="9" refX="7.4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#d9741a"/></marker></defs><text x="540.0" y="38" font-size="17" text-anchor="middle" fill="#1a1d21" font-weight="700" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">物理内核的整体替换：UE4 的 PhysX 与 UE5 的 Chaos</text><text x="540.0" y="62" font-size="12" text-anchor="middle" fill="#7a828a" font-weight="normal" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">这不是升级，是换引擎 —— 两套内核的接口、数据布局、求解模型都不同</text><rect x="40" y="80" width="455" height="50" rx="9" fill="#e8f0fe" stroke="none" stroke-width="1.2"/><text x="60" y="111" font-size="15" text-anchor="start" fill="#2f6feb" font-weight="700" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">UE4 · NVIDIA PhysX 3</text><rect x="585" y="80" width="455" height="50" rx="9" fill="#f5ebfa" stroke="none" stroke-width="1.2"/><text x="605" y="111" font-size="15" text-anchor="start" fill="#8e44ad" font-weight="700" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">UE5 · Epic Chaos</text><rect x="40" y="146" width="455" height="62" rx="8" fill="#fff" stroke="#e2e6ea" stroke-width="1.2"/><text x="56" y="170" font-size="12.5" text-anchor="start" fill="#2f6feb" font-weight="700" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">集成方式</text><text x="56" y="192" font-size="11" text-anchor="start" fill="#4a5158" font-weight="normal" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">外部库，NVIDIA 维护。UE 与 PhysX 的数据结构反复序列化 / 反序列化</text><rect x="585" y="146" width="455" height="62" rx="8" fill="#fff" stroke="#e2e6ea" stroke-width="1.2"/><text x="601" y="170" font-size="12.5" text-anchor="start" fill="#8e44ad" font-weight="700" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">集成方式</text><text x="601" y="192" font-size="11" text-anchor="start" fill="#4a5158" font-weight="normal" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">Epic 自研，UE 原生 C++ 实现。与引擎数据结构零拷贝</text><rect x="40" y="216" width="455" height="62" rx="8" fill="#fff" stroke="#e2e6ea" stroke-width="1.2"/><text x="56" y="240" font-size="12.5" text-anchor="start" fill="#2f6feb" font-weight="700" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">物理 Tick</text><text x="56" y="262" font-size="11" text-anchor="start" fill="#4a5158" font-weight="normal" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">跟随渲染帧率。掉帧即步长变化，物理结果随之漂移</text><rect x="585" y="216" width="455" height="62" rx="8" fill="#fff" stroke="#e2e6ea" stroke-width="1.2"/><text x="601" y="240" font-size="12.5" text-anchor="start" fill="#8e44ad" font-weight="700" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">物理 Tick</text><text x="601" y="262" font-size="11" text-anchor="start" fill="#4a5158" font-weight="normal" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">固定步长 + 独立异步求解线程，与渲染帧率解耦</text><rect x="40" y="286" width="455" height="62" rx="8" fill="#fff" stroke="#e2e6ea" stroke-width="1.2"/><text x="56" y="310" font-size="12.5" text-anchor="start" fill="#2f6feb" font-weight="700" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">求解范围</text><text x="56" y="332" font-size="11" text-anchor="start" fill="#4a5158" font-weight="normal" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">刚体 / 布料 / 破坏各自独立模块，互不共享世界</text><rect x="585" y="286" width="455" height="62" rx="8" fill="#fff" stroke="#e2e6ea" stroke-width="1.2"/><text x="601" y="310" font-size="12.5" text-anchor="start" fill="#8e44ad" font-weight="700" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">求解范围</text><text x="601" y="332" font-size="11" text-anchor="start" fill="#4a5158" font-weight="normal" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">统一解算器：刚体 + 约束 + 布料 + 毛发 + 载具 + 场 + 破坏同场交互</text><rect x="40" y="356" width="455" height="62" rx="8" fill="#fff" stroke="#e2e6ea" stroke-width="1.2"/><text x="56" y="380" font-size="12.5" text-anchor="start" fill="#2f6feb" font-weight="700" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">确定性</text><text x="56" y="402" font-size="11" text-anchor="start" fill="#4a5158" font-weight="normal" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">相对稳定，老项目行为可预期</text><rect x="585" y="356" width="455" height="62" rx="8" fill="#fff" stroke="#e2e6ea" stroke-width="1.2"/><text x="601" y="380" font-size="12.5" text-anchor="start" fill="#8e44ad" font-weight="700" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">确定性</text><text x="601" y="402" font-size="11" text-anchor="start" fill="#4a5158" font-weight="normal" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">不完全确定（跨平台 / 跨线程浮点差异）；Epic 建议不要追求 100%</text><rect x="40" y="426" width="455" height="62" rx="8" fill="#fff" stroke="#e2e6ea" stroke-width="1.2"/><text x="56" y="450" font-size="12.5" text-anchor="start" fill="#2f6feb" font-weight="700" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">载具</text><text x="56" y="472" font-size="11" text-anchor="start" fill="#4a5158" font-weight="normal" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">PhysX Vehicle，4.27 是最后一个可用版本</text><rect x="585" y="426" width="455" height="62" rx="8" fill="#fff" stroke="#e2e6ea" stroke-width="1.2"/><text x="601" y="450" font-size="12.5" text-anchor="start" fill="#8e44ad" font-weight="700" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">载具</text><text x="601" y="472" font-size="11" text-anchor="start" fill="#4a5158" font-weight="normal" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">Chaos Vehicle；5.5 另加 Chaos Modular Vehicle System（模块化载具）</text><line x1="516" y1="146" x2="516" y2="480" stroke="#e2e6ea" stroke-width="1.4" stroke-dasharray="4 4"/><rect x="508.0" y="166.5" width="64.0" height="19" rx="9.5" fill="#eef1f4" stroke="none" stroke-width="1.2"/><text x="540" y="179.6" font-size="10" text-anchor="middle" fill="#7a828a" font-weight="600" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">4.23 引入</text><line x1="516" y1="176" x2="528" y2="176" stroke="#e2e6ea" stroke-width="1.4"/><rect x="510.8" y="290.5" width="58.400000000000006" height="19" rx="9.5" fill="#eef1f4" stroke="none" stroke-width="1.2"/><text x="540" y="303.6" font-size="10" text-anchor="middle" fill="#2f6feb" font-weight="600" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">5.0 默认</text><line x1="516" y1="300" x2="528" y2="300" stroke="#e2e6ea" stroke-width="1.4"/><rect x="510.8" y="442.5" width="58.400000000000006" height="19" rx="9.5" fill="#eef1f4" stroke="none" stroke-width="1.2"/><text x="540" y="455.6" font-size="10" text-anchor="middle" fill="#c0392b" font-weight="600" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">5.1 移除</text><line x1="516" y1="452" x2="528" y2="452" stroke="#e2e6ea" stroke-width="1.4"/></svg>