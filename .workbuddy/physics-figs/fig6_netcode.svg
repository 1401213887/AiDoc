<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" width="1120" height="620"><rect x="0" y="0" width="1120" height="620" fill="#ffffff"/><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7.4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#7a828a"/></marker><marker id="ab" markerWidth="9" markerHeight="9" refX="7.4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2f6feb"/></marker><marker id="ac" markerWidth="9" markerHeight="9" refX="7.4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#8e44ad"/></marker><marker id="ao" markerWidth="9" markerHeight="9" refX="7.4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1f9254"/></marker><marker id="aw" markerWidth="9" markerHeight="9" refX="7.4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#c0392b"/></marker><marker id="am" markerWidth="9" markerHeight="9" refX="7.4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#d9741a"/></marker></defs><text x="560.0" y="38" font-size="17" text-anchor="middle" fill="#1a1d21" font-weight="700" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">物理的网络同步：两条互斥的路径</text><text x="560.0" y="62" font-size="12" text-anchor="middle" fill="#7a828a" font-weight="normal" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">同一款游戏往往只选一条 —— 选错会在「防作弊」与「确定性」之间反复返工</text><rect x="40" y="84" width="1040" height="214" rx="10" fill="#fff" stroke="#e2e6ea" stroke-width="1.2"/><text x="62" y="112" font-size="14" text-anchor="start" fill="#2f6feb" font-weight="700" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">路径 A · 帧同步（Lockstep）</text><text x="62" y="132" font-size="11" text-anchor="start" fill="#7a828a" font-weight="normal" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">只同步输入，各端自行模拟；要求物理与浮点结果逐位一致</text><text x="70" y="180" font-size="11" text-anchor="start" fill="#2f6feb" font-weight="700" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">客户端</text><text x="70" y="240" font-size="11" text-anchor="start" fill="#2f6feb" font-weight="700" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">服务器</text><line x1="120" y1="176" x2="1050" y2="176" stroke="#2f6feb" stroke-width="1.6"/><line x1="120" y1="236" x2="1050" y2="236" stroke="#2f6feb" stroke-width="1.6"/><circle cx="180" cy="176" r="4.5" fill="#2f6feb"/><text x="180" y="162" font-size="10.5" text-anchor="middle" fill="#4a5158" font-weight="600" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">本地模拟（帧 N）</text><line x1="300" y1="182" x2="300" y2="230" stroke="#2f6feb" stroke-width="1.6" marker-end="url(#ab)"/><text x="310" y="210.0" font-size="10.5" text-anchor="#4a5158" fill="#1a1d21" font-weight="normal" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">输入帧 N（几十字节）</text><text x="560" y="224" font-size="10.5" text-anchor="middle" fill="#4a5158" font-weight="600" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">校验 / 转发</text><line x1="700" y1="242" x2="700" y2="170" stroke="#2f6feb" stroke-width="1.6" marker-end="url(#ab)"/><text x="710" y="210.0" font-size="10.5" text-anchor="#4a5158" fill="#1a1d21" font-weight="normal" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">输入帧 N</text><circle cx="880" cy="176" r="4.5" fill="#2f6feb"/><text x="880" y="162" font-size="10.5" text-anchor="middle" fill="#4a5158" font-weight="600" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">同样模拟 → 同结果</text><text x="1050" y="206" font-size="10.5" text-anchor="start" fill="#1a1d21" font-weight="normal" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif"></text><rect x="130.0" y="268.5" width="60.0" height="19" rx="9.5" fill="#e6f6ec" stroke="none" stroke-width="1.2"/><text x="160" y="281.78" font-size="10.5" text-anchor="middle" fill="#1f9254" font-weight="600" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">带宽极省</text><rect x="254.25" y="268.5" width="91.5" height="19" rx="9.5" fill="#fdeaea" stroke="none" stroke-width="1.2"/><text x="300" y="281.78" font-size="10.5" text-anchor="middle" fill="#c0392b" font-weight="600" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">确定性是硬前提</text><rect x="399.68" y="268.5" width="140.64" height="19" rx="9.5" fill="#fdeaea" stroke="none" stroke-width="1.2"/><text x="470" y="281.78" font-size="10.5" text-anchor="middle" fill="#c0392b" font-weight="600" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">客户端掌状态 → 防作弊弱</text><rect x="644.25" y="268.5" width="91.5" height="19" rx="9.5" fill="#fdf8e8" stroke="none" stroke-width="1.2"/><text x="690" y="281.78" font-size="10.5" text-anchor="middle" fill="#8a6d1f" font-weight="600" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">断线重连代价高</text><rect x="40" y="316" width="1040" height="232" rx="10" fill="#fff" stroke="#e2e6ea" stroke-width="1.2"/><text x="62" y="344" font-size="14" text-anchor="start" fill="#1f9254" font-weight="700" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">路径 B · 服务器权威 + 客户端预测回滚</text><text x="62" y="364" font-size="11" text-anchor="start" fill="#7a828a" font-weight="normal" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">服务器是唯一真相；客户端先本地预测，收到权威状态后比对，不一致则回滚重放</text><text x="70" y="424" font-size="11" text-anchor="start" fill="#1f9254" font-weight="700" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">客户端</text><text x="70" y="494" font-size="11" text-anchor="start" fill="#1f9254" font-weight="700" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">服务器</text><line x1="120" y1="420" x2="1050" y2="420" stroke="#1f9254" stroke-width="1.6"/><line x1="120" y1="490" x2="1050" y2="490" stroke="#1f9254" stroke-width="1.6"/><circle cx="170" cy="420" r="4.5" fill="#1f9254"/><text x="175" y="406" font-size="10.5" text-anchor="middle" fill="#4a5158" font-weight="600" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">本地预测模拟</text><line x1="320" y1="414" x2="320" y2="496" stroke="#1f9254" stroke-width="1.6" marker-end="url(#ao)"/><text x="330" y="459.0" font-size="10.5" text-anchor="#4a5158" fill="#1a1d21" font-weight="normal" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">输入 + 时间戳</text><text x="560" y="478" font-size="10.5" text-anchor="middle" fill="#4a5158" font-weight="600" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">权威模拟</text><line x1="700" y1="496" x2="700" y2="414" stroke="#1f9254" stroke-width="1.6" marker-end="url(#ao)"/><text x="710" y="459.0" font-size="10.5" text-anchor="#4a5158" fill="#1a1d21" font-weight="normal" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">权威状态快照</text><circle cx="890" cy="420" r="4.5" fill="#1f9254"/><text x="910" y="406" font-size="10.5" text-anchor="middle" fill="#4a5158" font-weight="600" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">比对 → 一致：继续</text><text x="910" y="442" font-size="10.5" text-anchor="middle" fill="#c0392b" font-weight="600" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">不一致：回滚重放</text><rect x="130.0" y="530.5" width="60.0" height="19" rx="9.5" fill="#e6f6ec" stroke="none" stroke-width="1.2"/><text x="160" y="543.78" font-size="10.5" text-anchor="middle" fill="#1f9254" font-weight="600" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">防作弊强</text><rect x="239.5" y="530.5" width="81.0" height="19" rx="9.5" fill="#e6f6ec" stroke="none" stroke-width="1.2"/><text x="280" y="543.78" font-size="10.5" text-anchor="middle" fill="#1f9254" font-weight="600" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">物理交互一致</text><rect x="360.18" y="530.5" width="119.64" height="19" rx="9.5" fill="#fdeaea" stroke="none" stroke-width="1.2"/><text x="420" y="543.78" font-size="10.5" text-anchor="middle" fill="#c0392b" font-weight="600" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">带宽 / 服务器开销高</text><rect x="522.41" y="530.5" width="135.18" height="19" rx="9.5" fill="#fdf8e8" stroke="none" stroke-width="1.2"/><text x="590" y="543.78" font-size="10.5" text-anchor="middle" fill="#8a6d1f" font-weight="600" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">UE5.4 网络物理为 Beta</text><text x="560.0" y="588" font-size="12" text-anchor="middle" fill="#c0392b" font-weight="700" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">Chaos 不是完全确定性的：跨平台 / 跨线程浮点差异会持续制造「橡皮筋」修正。</text></svg>