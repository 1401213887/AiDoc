<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1090 580" width="1090" height="580"><rect x="0" y="0" width="1090" height="580" fill="#ffffff"/><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7.4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#7a828a"/></marker><marker id="ab" markerWidth="9" markerHeight="9" refX="7.4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2f6feb"/></marker><marker id="ac" markerWidth="9" markerHeight="9" refX="7.4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#8e44ad"/></marker><marker id="ao" markerWidth="9" markerHeight="9" refX="7.4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1f9254"/></marker><marker id="aw" markerWidth="9" markerHeight="9" refX="7.4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#c0392b"/></marker><marker id="am" markerWidth="9" markerHeight="9" refX="7.4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#d9741a"/></marker></defs><text x="545.0" y="38" font-size="17" text-anchor="middle" fill="#1a1d21" font-weight="700" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">移动端物理预算与六个优化杠杆</text><text x="545.0" y="62" font-size="12" text-anchor="middle" fill="#7a828a" font-weight="normal" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">以 30fps（帧预算 33.3ms）为参照，物理的典型占用与可压缩空间</text><text x="60" y="106" font-size="12" text-anchor="start" fill="#1a1d21" font-weight="700" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">一帧 33.3ms 的 CPU 预算</text><text x="1030" y="106" font-size="11" text-anchor="end" fill="#7a828a" font-weight="normal" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">物理典型 1~4ms ≈ 3%~12%</text><rect x="60" y="116" width="970" height="46" rx="8" fill="#eef1f4" stroke="#e2e6ea" stroke-width="1.2"/><rect x="60" y="116" width="117" height="46" rx="8" fill="#d9741a" opacity=".9"/><text x="118" y="145" font-size="11.5" text-anchor="middle" fill="#fff" font-weight="700" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">物理 4ms</text><text x="560" y="145" font-size="11.5" text-anchor="middle" fill="#4a5158" font-weight="normal" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">其余：GameThread 逻辑 / 动画 / VFX / AI + RenderThread 提交</text><text x="950" y="145" font-size="11" text-anchor="middle" fill="#7a828a" font-weight="normal" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">GPU 另计</text><rect x="60" y="200" width="316" height="138" rx="9" fill="#fff" stroke="#e2e6ea" stroke-width="1.2"/><text x="76" y="228" font-size="13" text-anchor="start" fill="#d9741a" font-weight="700" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">① 简化碰撞体</text><text x="76" y="252" font-size="11" text-anchor="start" fill="#4a5158" font-weight="normal" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">三角网格 → 凸包 → 胶囊 → 球</text><rect x="76" y="302" width="284" height="24" rx="6" fill="#fdf0e4"/><text x="86" y="319" font-size="10.5" text-anchor="start" fill="#d9741a" font-weight="700" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">收益：成本可降一个数量级</text><rect x="394" y="200" width="316" height="138" rx="9" fill="#fff" stroke="#e2e6ea" stroke-width="1.2"/><text x="410" y="228" font-size="13" text-anchor="start" fill="#d9741a" font-weight="700" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">② 降频与子步进</text><text x="410" y="252" font-size="11" text-anchor="start" fill="#4a5158" font-weight="normal" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">物理 tick 60Hz → 30Hz，</text><text x="410" y="270" font-size="11" text-anchor="start" fill="#4a5158" font-weight="normal" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">限制 MaxSubsteps 防「死亡螺旋」</text><rect x="410" y="302" width="284" height="24" rx="6" fill="#fdf0e4"/><text x="420" y="319" font-size="10.5" text-anchor="start" fill="#d9741a" font-weight="700" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">收益：直接减半</text><rect x="728" y="200" width="316" height="138" rx="9" fill="#fff" stroke="#e2e6ea" stroke-width="1.2"/><text x="744" y="228" font-size="13" text-anchor="start" fill="#d9741a" font-weight="700" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">③ 休眠与剔除</text><text x="744" y="252" font-size="11" text-anchor="start" fill="#4a5158" font-weight="normal" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">Sleep Threshold 0.1~1.0，</text><text x="744" y="270" font-size="11" text-anchor="start" fill="#4a5158" font-weight="normal" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">屏幕外 / 静止体停止积分</text><rect x="744" y="302" width="284" height="24" rx="6" fill="#fdf0e4"/><text x="754" y="319" font-size="10.5" text-anchor="start" fill="#d9741a" font-weight="700" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">收益：随场景而定</text><rect x="60" y="354" width="316" height="138" rx="9" fill="#fff" stroke="#e2e6ea" stroke-width="1.2"/><text x="76" y="382" font-size="13" text-anchor="start" fill="#d9741a" font-weight="700" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">④ 物理 / 视觉解耦</text><text x="76" y="406" font-size="11" text-anchor="start" fill="#4a5158" font-weight="normal" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">「碰的」与「看的」分离，</text><text x="76" y="424" font-size="11" text-anchor="start" fill="#4a5158" font-weight="normal" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">物理属性挂到更近的 Streaming 层</text><rect x="76" y="456" width="284" height="24" rx="6" fill="#fdf0e4"/><text x="86" y="473" font-size="10.5" text-anchor="start" fill="#d9741a" font-weight="700" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">收益：降内存 + 降场景复杂度</text><rect x="394" y="354" width="316" height="138" rx="9" fill="#fff" stroke="#e2e6ea" stroke-width="1.2"/><text x="410" y="382" font-size="13" text-anchor="start" fill="#d9741a" font-weight="700" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">⑤ VAT / 烘焙替代</text><text x="410" y="406" font-size="11" text-anchor="start" fill="#4a5158" font-weight="normal" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">布料、摆动、碎片改顶点动画贴图，</text><text x="410" y="424" font-size="11" text-anchor="start" fill="#4a5158" font-weight="normal" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">离线烘焙，运行时只采贴图</text><rect x="410" y="456" width="284" height="24" rx="6" fill="#fdf0e4"/><text x="420" y="473" font-size="10.5" text-anchor="start" fill="#d9741a" font-weight="700" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">收益：把 CPU 计算搬到离线</text><rect x="728" y="354" width="316" height="138" rx="9" fill="#fff" stroke="#e2e6ea" stroke-width="1.2"/><text x="744" y="382" font-size="13" text-anchor="start" fill="#d9741a" font-weight="700" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">⑥ 服务器权威</text><text x="744" y="406" font-size="11" text-anchor="start" fill="#4a5158" font-weight="normal" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">只算影响胜负的物体，</text><text x="744" y="424" font-size="11" text-anchor="start" fill="#4a5158" font-weight="normal" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">纯表现物做客户端本地模拟</text><rect x="744" y="456" width="284" height="24" rx="6" fill="#fdf0e4"/><text x="754" y="473" font-size="10.5" text-anchor="start" fill="#d9741a" font-weight="700" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">收益：服务器 CPU 可控</text><text x="545.0" y="514" font-size="11.5" text-anchor="middle" fill="#7a828a" font-weight="600" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">六个杠杆里，①③④ 是工程改动，②⑤⑥ 是设计 / 架构决策 —— 后三个收益最大但改得最晚。</text></svg>