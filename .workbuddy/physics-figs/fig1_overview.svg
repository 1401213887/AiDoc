<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 690" width="1080" height="690"><rect x="0" y="0" width="1080" height="690" fill="#ffffff"/><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7.4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#7a828a"/></marker><marker id="ab" markerWidth="9" markerHeight="9" refX="7.4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2f6feb"/></marker><marker id="ac" markerWidth="9" markerHeight="9" refX="7.4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#8e44ad"/></marker><marker id="ao" markerWidth="9" markerHeight="9" refX="7.4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1f9254"/></marker><marker id="aw" markerWidth="9" markerHeight="9" refX="7.4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#c0392b"/></marker><marker id="am" markerWidth="9" markerHeight="9" refX="7.4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#d9741a"/></marker></defs><text x="540.0" y="38" font-size="17" text-anchor="middle" fill="#1a1d21" font-weight="700" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">手游「物理」的五层分解</text><text x="540.0" y="62" font-size="12" text-anchor="middle" fill="#7a828a" font-weight="normal" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">同一个词，五套完全不同的实现 —— 只有中间两层真的在跑引擎物理求解器</text><rect x="40" y="96" width="1000" height="86" rx="9" fill="#fff" stroke="#e2e6ea" stroke-width="1.2"/><rect x="40" y="100" width="6" height="78" rx="3" fill="#c0392b"/><text x="66" y="130" font-size="14.5" text-anchor="start" fill="#1a1d21" font-weight="700" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">① 角色移动 / 位移</text><text x="66" y="152" font-size="11" text-anchor="start" fill="#7a828a" font-weight="normal" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">每帧 · 全平台适用</text><line x1="258" y1="114" x2="258" y2="164" stroke="#e2e6ea" stroke-width="1.2"/><text x="278" y="130" font-size="12.5" text-anchor="start" fill="#4a5158" font-weight="600" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">CMC（Character Movement Component）或自研 KCC</text><text x="278" y="152" font-size="11" text-anchor="start" fill="#7a828a" font-weight="normal" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">胶囊体 + 自定义扫掠，不走刚体求解器；为网络同步与手感而绕过物理</text><rect x="917.52" y="128.5" width="102.48" height="21" rx="10.5" fill="#fdeaea" stroke="none" stroke-width="1.2"/><text x="968.76" y="142.96" font-size="11" text-anchor="middle" fill="#c0392b" font-weight="600" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">自研 / 不用物理</text><rect x="40" y="194" width="1000" height="86" rx="9" fill="#fff" stroke="#e2e6ea" stroke-width="1.2"/><rect x="40" y="198" width="6" height="78" rx="3" fill="#1f9254"/><text x="66" y="228" font-size="14.5" text-anchor="start" fill="#1a1d21" font-weight="700" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">② 载具</text><text x="66" y="250" font-size="11" text-anchor="start" fill="#7a828a" font-weight="normal" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">每帧 · 有载具的游戏</text><line x1="258" y1="212" x2="258" y2="262" stroke="#e2e6ea" stroke-width="1.2"/><text x="278" y="228" font-size="12.5" text-anchor="start" fill="#4a5158" font-weight="600" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">UE4：PhysX Vehicle　UE5：Chaos Vehicle，大厂多自研改造</text><text x="278" y="250" font-size="11" text-anchor="start" fill="#7a828a" font-weight="normal" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">轮胎摩擦模型 + 悬挂射线检测，是独立于刚体的专用求解分支</text><rect x="903.0" y="226.5" width="117.0" height="21" rx="10.5" fill="#e6f6ec" stroke="none" stroke-width="1.2"/><text x="961.5" y="240.96" font-size="11" text-anchor="middle" fill="#1f9254" font-weight="600" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">引擎物理（可替换）</text><rect x="40" y="292" width="1000" height="86" rx="9" fill="#fff" stroke="#e2e6ea" stroke-width="1.2"/><rect x="40" y="296" width="6" height="78" rx="3" fill="#1f9254"/><text x="66" y="326" font-size="14.5" text-anchor="start" fill="#1a1d21" font-weight="700" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">③ 布娃娃 / 受击</text><text x="66" y="348" font-size="11" text-anchor="start" fill="#7a828a" font-weight="normal" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">事件触发 · 持续 2~4 秒</text><line x1="258" y1="310" x2="258" y2="360" stroke="#e2e6ea" stroke-width="1.2"/><text x="278" y="326" font-size="12.5" text-anchor="start" fill="#4a5158" font-weight="600" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">引擎 ragdoll，降频 + 简化碰撞体</text><text x="278" y="348" font-size="11" text-anchor="start" fill="#7a828a" font-weight="normal" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">每具 12~20 个胶囊体，受击后短时间求解，结束后切回动画或冻结</text><rect x="914.0" y="324.5" width="106.0" height="21" rx="10.5" fill="#e6f6ec" stroke="none" stroke-width="1.2"/><text x="967.0" y="338.96" font-size="11" text-anchor="middle" fill="#1f9254" font-weight="600" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">引擎物理（简化）</text><rect x="40" y="390" width="1000" height="86" rx="9" fill="#fff" stroke="#e2e6ea" stroke-width="1.2"/><rect x="40" y="394" width="6" height="78" rx="3" fill="#8a6d1f"/><text x="66" y="424" font-size="14.5" text-anchor="start" fill="#1a1d21" font-weight="700" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">④ 布料 / 毛发</text><text x="66" y="446" font-size="11" text-anchor="start" fill="#7a828a" font-weight="normal" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">每帧 · 仅高配档开启</text><line x1="258" y1="408" x2="258" y2="458" stroke="#e2e6ea" stroke-width="1.2"/><text x="278" y="424" font-size="12.5" text-anchor="start" fill="#4a5158" font-weight="600" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">UE5 Chaos Cloth ／ 骨骼链伪物理 ／ VAT 顶点动画烘焙</text><text x="278" y="446" font-size="11" text-anchor="start" fill="#7a828a" font-weight="normal" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">移动端目标 ≈1ms、200~600 模拟顶点；毛发（Groom）几乎必然降级</text><rect x="917.52" y="422.5" width="102.48" height="21" rx="10.5" fill="#fdf8e8" stroke="none" stroke-width="1.2"/><text x="968.76" y="436.96" font-size="11" text-anchor="middle" fill="#8a6d1f" font-weight="600" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">部分 + 必须降级</text><rect x="40" y="488" width="1000" height="86" rx="9" fill="#fff" stroke="#e2e6ea" stroke-width="1.2"/><rect x="40" y="492" width="6" height="78" rx="3" fill="#c0392b"/><text x="66" y="522" font-size="14.5" text-anchor="start" fill="#1a1d21" font-weight="700" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">⑤ 破坏 / 碎片</text><text x="66" y="544" font-size="11" text-anchor="start" fill="#7a828a" font-weight="normal" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">事件触发 · 瞬时</text><line x1="258" y1="506" x2="258" y2="556" stroke="#e2e6ea" stroke-width="1.2"/><text x="278" y="522" font-size="12.5" text-anchor="start" fill="#4a5158" font-weight="600" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">预制分块 + 特效 + VAT，极少用实时 Chaos Destruction</text><text x="278" y="544" font-size="11" text-anchor="start" fill="#7a828a" font-weight="normal" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">实时断裂（Geometry Collection）在移动端预算之外，多数是「看起来碎了」</text><rect x="917.52" y="520.5" width="102.48" height="21" rx="10.5" fill="#fdeaea" stroke="none" stroke-width="1.2"/><text x="968.76" y="534.96" font-size="11" text-anchor="middle" fill="#c0392b" font-weight="600" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">烘焙 / 特效为主</text><rect x="40" y="592" width="1000" height="56" rx="9" fill="#e8f0fe" stroke="none" stroke-width="1.2"/><text x="540" y="618" font-size="12.5" text-anchor="middle" fill="#2f6feb" font-weight="700" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">结论：手游里真正走「引擎物理求解器」的只有 ②③，④ 是高配限定，① ⑤ 是自研或烘焙。</text><text x="540" y="638" font-size="11.5" text-anchor="middle" fill="#4a5158" font-weight="normal" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">把端游的物理配置直接搬到移动端，等于把 100% 的物理预算压在 20% 的玩法上。</text></svg>