<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 480" width="1160" height="480"><rect x="0" y="0" width="1160" height="480" fill="#ffffff"/><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7.4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#7a828a"/></marker><marker id="ab" markerWidth="9" markerHeight="9" refX="7.4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2f6feb"/></marker><marker id="ac" markerWidth="9" markerHeight="9" refX="7.4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#8e44ad"/></marker><marker id="ao" markerWidth="9" markerHeight="9" refX="7.4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1f9254"/></marker><marker id="aw" markerWidth="9" markerHeight="9" refX="7.4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#c0392b"/></marker><marker id="am" markerWidth="9" markerHeight="9" refX="7.4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#d9741a"/></marker></defs><text x="580.0" y="38" font-size="17" text-anchor="middle" fill="#1a1d21" font-weight="700" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">一个受击布娃娃的一生</text><text x="580.0" y="62" font-size="12" text-anchor="middle" fill="#7a828a" font-weight="normal" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">跟着一次「击杀命中」的事件，走完服务器与客户端两侧的完整链路</text><rect x="30.0" y="190" width="200" height="126" rx="9" fill="#fff" stroke="#e2e6ea" stroke-width="1.2"/><rect x="30.0" y="190" width="200" height="5" rx="2.5" fill="#d9741a"/><text x="130.0" y="230" font-size="12.5" text-anchor="middle" fill="#1a1d21" font-weight="700" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">① 命中判定</text><text x="130.0" y="260" font-size="10.5" text-anchor="middle" fill="#7a828a" font-weight="normal" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">服务器权威判定</text><text x="130.0" y="280" font-size="10.5" text-anchor="middle" fill="#7a828a" font-weight="normal" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">本帧是否致死 / 触发 ragdoll</text><rect x="330.0" y="190" width="200" height="126" rx="9" fill="#fff" stroke="#e2e6ea" stroke-width="1.2"/><rect x="330.0" y="190" width="200" height="5" rx="2.5" fill="#d9741a"/><text x="430.0" y="230" font-size="12.5" text-anchor="middle" fill="#1a1d21" font-weight="700" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">② 物理场景注册 + 求解</text><text x="430.0" y="260" font-size="10.5" text-anchor="middle" fill="#7a828a" font-weight="normal" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">12~20 个胶囊体</text><text x="430.0" y="280" font-size="10.5" text-anchor="middle" fill="#7a828a" font-weight="normal" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">固定步长 1/30~1/60，异步线程</text><rect x="630.0" y="190" width="200" height="126" rx="9" fill="#fff" stroke="#e2e6ea" stroke-width="1.2"/><rect x="630.0" y="190" width="200" height="5" rx="2.5" fill="#d9741a"/><text x="730.0" y="230" font-size="12.5" text-anchor="middle" fill="#1a1d21" font-weight="700" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">③ 状态复制</text><text x="730.0" y="260" font-size="10.5" text-anchor="middle" fill="#7a828a" font-weight="normal" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">位置 + 速度</text><text x="730.0" y="280" font-size="10.5" text-anchor="middle" fill="#7a828a" font-weight="normal" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">量化后按 20Hz 下发</text><rect x="930.0" y="190" width="200" height="126" rx="9" fill="#fff" stroke="#e2e6ea" stroke-width="1.2"/><rect x="930.0" y="190" width="200" height="5" rx="2.5" fill="#d9741a"/><text x="1030.0" y="230" font-size="12.5" text-anchor="middle" fill="#1a1d21" font-weight="700" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">④ 客户端表现</text><text x="1030.0" y="260" font-size="10.5" text-anchor="middle" fill="#7a828a" font-weight="normal" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">插值补帧 / 必要时回滚重放</text><text x="1030.0" y="280" font-size="10.5" text-anchor="middle" fill="#7a828a" font-weight="normal" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">物理骨架映射回渲染骨架</text><line x1="238.0" y1="257.0" x2="322.0" y2="257.0" stroke="#d9741a" stroke-width="1.6" marker-end="url(#am)"/><text x="280.0" y="242.0" font-size="10" text-anchor="middle" fill="#d9741a" font-weight="700" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">触发标记 + 冲量</text><line x1="538.0" y1="257.0" x2="622.0" y2="257.0" stroke="#d9741a" stroke-width="1.6" marker-end="url(#am)"/><text x="580.0" y="242.0" font-size="10" text-anchor="middle" fill="#d9741a" font-weight="700" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">位姿 + 速度</text><line x1="838.0" y1="257.0" x2="922.0" y2="257.0" stroke="#d9741a" stroke-width="1.6" marker-end="url(#am)"/><text x="880.0" y="242.0" font-size="10" text-anchor="middle" fill="#d9741a" font-weight="700" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">快照（量化）</text><line x1="130.0" y1="384" x2="130.0" y2="324" stroke="#7a828a" stroke-width="1.6" marker-end="url(#a)"/><text x="130.0" y="402" font-size="11" text-anchor="middle" fill="#4a5158" font-weight="600" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">击杀 / 受击事件</text><rect x="230.0" y="420" width="700" height="40" rx="8" fill="#eef1f4" stroke="none" stroke-width="1.2"/><text x="580.0" y="445" font-size="11.5" text-anchor="middle" fill="#4a5158" font-weight="600" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">服务器与客户端各跑一份 UWorld 物理场景实例 —— 一致性靠复制与回滚，不靠确定性</text></svg>